server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

api:
  security:
    token:
      secret: ${JWT_SECRET:super_secret_key_for_development_environment}
