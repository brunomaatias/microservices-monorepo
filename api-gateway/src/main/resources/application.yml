server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: http://localhost:8081
            predicates:
              - Path=/auth/**
          - id: user-service
            uri: http://localhost:8082
            predicates:
              - Path=/users/**

management:
  endpoints:
    web:
      exposure:
        include: "*"

api:
  security:
    token:
      secret: super_secret_key_for_development_environment
