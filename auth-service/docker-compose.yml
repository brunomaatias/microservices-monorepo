services:
  postgres:
    image: postgres:15-alpine
    container_name: fsm_postgres
    environment:
      POSTGRES_USER: fsm_user
      POSTGRES_PASSWORD: fsm_password
      POSTGRES_DB: fsm_auth
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
