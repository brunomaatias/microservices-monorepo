spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/fsm_auth
    username: fsm_user
    password: fsm_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

api:
  security:
    token:
      secret: ${JWT_SECRET:super_secret_key_for_development_environment}

server:
  port: 8081
